<html>
<head>
<style>
	.tooltip {
    position: absolute;
    z-index: 10;
    visibility: hidden;
    background-color: white;
    text-align: center;
    padding: 4px;
    border-radius: 4px;
    font-weight: bold;
    color: black;
}
/* basic positioning */
.legend { list-style: none; margin-left: 480px;  }
.legend li { float: left; margin-right: 10px; }
.legend span { border: 1px solid #ccc; float: left; width: 12px; height: 12px;font-size: 10px; margin: 2px; font-family: "Arial", Times, serif; }
/* your colors */
.legend .mostsigthed { background-color: #1F77B4; }
.legend .leastsighted { background-color: #E377C2; }
.legend .kindaawesome { background-color: #0000ff; }
.legend .notawesome { background-color: #000000; }
h1 { color: #111; font-family: 'Helvetica Neue', sans-serif; font-size: 20px; font-weight: bold; letter-spacing: -1px; line-height: 1; text-align: center; }
</style>
</head>
<body>
   
	<div id="chart"></div>
	<script src="../../js/team6/d3.v4.min.js"></script>
    <script>
	(function(){
    // Fixed size to fit the 960x500 modal iframe; append svg into #chart (instead of body) for containment
    var width = 960,
        height = 480;
    var tooltip = d3.select("body")
     .append("div")
    .attr('class', 'tooltip');

    var svg = d3.select("#chart")
    .append("svg")
    .attr("width", width)
    .attr("height", height);

    


    var radiusScale = d3.scaleSqrt().domain([2,7562]).range([15,85]);
    var color = d3.scaleOrdinal(d3.schemeCategory20);
    //the simulation is a collection of forces 
    //about where we want our circles to go
    //and how we want our circle to interact
    //STEP ONE: get them to the middle
    //STEP TWO: dont't have them to collide
    var simulation = d3.forceSimulation()
    .force("x",d3.forceX(width/2).strength(0.05))
    .force("y",d3.forceY(height/2).strength(0.05))
    .force("collide",d3.forceCollide(function(d){
        return radiusScale(+d.count) + 1;
    }));

    d3.queue()
    .defer(d3.csv, "/data/team6/bubble_chart_sightings.csv")
    .await(ready);

    function ready(error, datapoints){
        if (error) {
            console.error("Bubble data load failed:", error);
            svg.append("text").attr("x", 20).attr("y", 20).text("Error loading bubble data");
            return;
        }
        // d3.csv v4 leaves numbers as strings; coerce for scales/forces
        datapoints.forEach(function(d) { d.count = +d.count; });

        var circles = svg.selectAll("circle")
        .data(datapoints)
        .enter().append("circle")
        .attr("class","artist")
        .attr("r", function(d){
            return radiusScale(d.count);
        })
        .attr("fill", function(d,i){ return color(i); })
        .on('click', function(d){
            console.log(d);
        })
        .on("mouseover", function(d) {
         return tooltip.style("visibility", "visible").text(d.state + " (" + d.count + ")");
        })
        .on("mousemove", function() {
            var e = d3.event;
            return tooltip.style("top", (e.pageY - 30) + "px")
            .style("left", e.pageX + "px");
        })
  
        // we hide our tooltip on "mouseout"
  
        .on("mouseout", function() {
            return tooltip.style("visibility", "hidden");
        });

        var texts = svg.selectAll("text").data(datapoints).enter().append("text")
            .attr("text-anchor", "middle")
            .attr("font-family", "Arial")
            .attr("font-size", "9px")
            .attr("fill", "#fff");

        simulation.nodes(datapoints)
            .on('tick', ticked);

        function ticked(){
            circles
            .attr("cx", function(d){ return d.x; })
            .attr("cy", function(d){ return d.y; });

            texts
            .attr("x", function(d){ return d.x; })
            .attr("y", function(d){ return d.y; })
            .text(function(d){ return d.abbr; });
        }

    }
})();
</script>

</body>
</html>
