<!DOCTYPE html>
<meta charset="utf-8">

<head>
    <title>Location Map</title>
    <link href="../css/bootstrap.min.css" rel="stylesheet">

    <!-- Scrolling Nav CSS -->
    <link href="../css/scrolling-nav.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link href="../css/styles.css" rel="stylesheet">

<style>

/* stylesheet for your custom graph */

.states {
  fill: none;
  stroke: #fff;
  stroke-linejoin: round;
}

.states-choropleth {
  fill: #ccc;
}

#tooltip-container {
  position: absolute;
  background-color: #fff;
  color: #000;
  padding: 10px;
  border: 1px solid;
  display: none;
}

.tooltip_key {
  font-weight: bold;
}

.tooltip_value {
  margin-left: 20px;
  float: right;
}

</style>
</head>

<body style="margin:0; padding:8px; background:#fff; font-family: sans-serif; color:#222;">
            <div>Hover over map to see the count of UFO sightings in each state</div>
            <div id="tooltip-container"></div>
            <div id="canvas-svg"></div>
    </div>
</body>

<script src="../js/d3.v3.min.js"></script>
<script src="../js/jquery.js"></script>

<script>

d3.csv("/html/population.csv", function(err, data) {

  var config = {"color1":"#f1ff0f","color2":"#6b0808","stateDataColumn":"Row_Labels","valueDataColumn":"Count_of_City_name"}
  
  var WIDTH = 800, HEIGHT = 500;
  
  var COLOR_COUNTS = 9;
  
  var SCALE = 0.7;
  
  function Interpolate(start, end, steps, count) {
      var s = start,
          e = end,
          final = s + (((e - s) / steps) * count);
      return Math.floor(final);
  }
  
  function Color(_r, _g, _b) {
      var r, g, b;
      var setColors = function(_r, _g, _b) {
          r = _r;
          g = _g;
          b = _b;
      };
  
      setColors(_r, _g, _b);
      this.getColors = function() {
          var colors = {
              r: r,
              g: g,
              b: b
          };
          return colors;
      };
  }
  
  function hexToRgb(hex) {
      var result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
      return result ? {
          r: parseInt(result[1], 16),
          g: parseInt(result[2], 16),
          b: parseInt(result[3], 16)
      } : null;
  }
  
  function valueFormat(d) {
    if (d > 1000000000) {
      return Math.round(d / 1000000000 * 10) / 10 + "B";
    } else if (d > 1000000) {
      return Math.round(d / 1000000 * 10) / 10 + "M";
    } else if (d > 1000) {
      return Math.round(d / 1000 * 10) / 10 + "K";
    } else {
      return d;
    }
  }
  
  var COLOR_FIRST = config.color1, COLOR_LAST = config.color2;
  
  var rgb = hexToRgb(COLOR_FIRST);
  
  var COLOR_START = new Color(rgb.r, rgb.g, rgb.b);
  
  rgb = hexToRgb(COLOR_LAST);
  var COLOR_END = new Color(rgb.r, rgb.g, rgb.b);
  
  var MAP_STATE = config.stateDataColumn;
  var MAP_VALUE = config.valueDataColumn;
  
  var width = WIDTH,
      height = HEIGHT;
  
  var valueByName = {};
  
  var startColors = COLOR_START.getColors(),
      endColors = COLOR_END.getColors();
  
  var colors = [];
  
  for (var i = 0; i < COLOR_COUNTS; i++) {
    var r = Interpolate(startColors.r, endColors.r, COLOR_COUNTS, i);
    var g = Interpolate(startColors.g, endColors.g, COLOR_COUNTS, i);
    var b = Interpolate(startColors.b, endColors.b, COLOR_COUNTS, i);
    colors.push(new Color(r, g, b));
  }
  
  var quantize = d3.scale.quantize()
      .domain([0, 1.0])
      .range(d3.range(COLOR_COUNTS).map(function(i) { return i }));
  
  var path = d3.geo.path();
  
  var svg = d3.select("#canvas-svg").append("svg")
      .attr("width", width)
      .attr("height", height);
  
  // Use local geojson (FeatureCollection) instead of external S3 topojson + tsv
  d3.json("../data_files/us-states.json", function(error, usGeo) {
    if (error) {
      console.error("Failed to load local us states geo", error);
      d3.select("#canvas-svg").append("text").attr("x",10).attr("y",20).text("Map data unavailable");
      return;
    }
    var features = usGeo.features || [];
  
    data.forEach(function(d) {
      valueByName[ d[MAP_STATE] ] = +d[MAP_VALUE]; 
    });
  
    quantize.domain([d3.min(data, function(d){ return +d[MAP_VALUE] }),
      d3.max(data, function(d){ return +d[MAP_VALUE] })]);
  
    svg.append("g")
        .attr("class", "states-choropleth")
      .selectAll("path")
        .data(features)
      .enter().append("path")
        .attr("transform", "scale(" + SCALE + ")")
        .style("fill", function(d) {
          var nm = d.properties && d.properties.name;
          if (nm && valueByName[nm] != null) {
            var i = quantize(valueByName[nm]);
            var color = colors[i].getColors();
            return "rgb(" + color.r + "," + color.g + "," + color.b + ")";
          } else {
            return "#ddd";
          }
        })
        .style("stroke", "#fff")
        .style("stroke-width", 0.5)
        .attr("d", path)
        .on("mousemove", function(d) {
            var nm = d.properties && d.properties.name;
            var html = "";
            html += "<div class=\"tooltip_kv\">";
            html += "<span class=\"tooltip_key\">";
            html += (nm || "Unknown");
            html += "</span>";
            html += "<span class=\"tooltip_value\">";
            html += (nm && valueByName[nm] != null ? valueFormat(valueByName[nm]) : "");
            html += "";
            html += "</span>";
            html += "</div>";
            
            $("#tooltip-container").html(html);
            d3.select(this).attr("fill-opacity", "0.8");
            $("#tooltip-container").show();
            
            var coordinates = d3.mouse(this);
            
            var map_width = $('.states-choropleth')[0] ? $('.states-choropleth')[0].getBoundingClientRect().width : 400;
            
            var ev = d3.event;
            if (ev.layerX < map_width / 2) {
              d3.select("#tooltip-container")
                .style("top", (ev.layerY + 15) + "px")
                .style("left", (ev.layerX + 15) + "px");
            } else {
              var tooltip_width = $("#tooltip-container").width() || 100;
              d3.select("#tooltip-container")
                .style("top", (ev.layerY + 15) + "px")
                .style("left", (ev.layerX - tooltip_width - 30) + "px");
            }
        })
        .on("mouseout", function() {
                d3.select(this).attr("fill-opacity", "1.0");
                $("#tooltip-container").hide();
            });
  });
});

</script>
