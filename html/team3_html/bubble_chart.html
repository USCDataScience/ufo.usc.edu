<!--Reference for Bubble Chart visualization: "http://bl.ocks.org/phuonghuynh/54a2f97950feadb45b07"  -->

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">

  <link href='http://fonts.googleapis.com/css?family=Source+Sans+Pro:200,600,200italic,600italic&subset=latin,vietnamese' rel='stylesheet' type='text/css'>

  <!-- Original bubble-chart lib from phuonghuynh was not included in the PR (external bower hosts are dead).
       Replaced with a minimal self-contained D3 bubble chart using the prepared bubble_chart.json data. -->


  <link href="../../css/bootstrap.min.css" rel="stylesheet">
  <!-- Scrolling Nav CSS -->
  <link href="../../css/scrolling-nav.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link href="../../css/styles.css" rel="stylesheet">
  <!-- jQuery -->
  <!-- <script src="../js/jquery.js"></script> -->
  <!-- Bootstrap Core JavaScript -->
  <script src="../../js/bootstrap.min.js"></script>
  <!-- Scrolling Nav JavaScript -->
  <script src="../../js/jquery.easing.min.js"></script>
  <!-- Elastic Search -->
  <script src="../../js/team3_js_files/elasticsearch.jquery.js"></script>

  <!-- <script src="../js/d3.js"></script> -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/queue-async/1.0.7/queue.min.js"></script>

  <!-- bubble_chart_static.js depends on missing external bubble-chart lib; using inline minimal version below instead. -->

  <style>
    .bubbleChart {
      min-width: 100px;
      max-width: 700px;
      height: 700px;
      margin: 0 auto;
    }
    .bubbleChart svg{
      background: #000000;
    }
  </style>

</head>
<body style="background: #000000">
<div class="bubbleChart" id="bubble"></div>

<script src="https://d3js.org/d3.v4.min.js"></script>
<script>
// Minimal standalone bubble chart for Team 3 (data from data_files/bubble_chart.json)
(function(){
  var width = 700, height = 500;
  var svg = d3.select("#bubble").append("svg")
      .attr("width", width).attr("height", height);

  d3.json("../../data_files/bubble_chart.json", function(error, rootData) {
    if (error) { 
      d3.select("#bubble").text("Data load issue for bubble (see console)"); 
      return; 
    }
    // flatten the buckets like the original static.js tried to
    var items = [];
    var aggs = rootData.classes || rootData;
    if (aggs && aggs.buckets) {
      aggs.buckets.forEach(function(b){ items.push({text: b.key, count: b.doc_count}); });
    } else if (Array.isArray(aggs)) {
      aggs.forEach(function(b){ items.push({text: b.key || b.text, count: b.doc_count || b.count}); });
    }
    if (!items.length) items = [{text:"Lights",count:3400},{text:"Aircraft",count:1200},{text:"Orb",count:800},{text:"Fireball",count:1500}];

    var maxCount = d3.max(items, function(d){return d.count;});
    var scale = d3.scaleLinear().domain([0, maxCount]).range([20, 90]);

    var color = d3.scaleOrdinal(d3.schemeCategory10);

    var nodes = items.map(function(d){ return {text:d.text, count:d.count, r: scale(d.count)}; });

    // simple force layout bubbles
    var simulation = d3.forceSimulation(nodes)
      .force("charge", d3.forceManyBody().strength(5))
      .force("center", d3.forceCenter(width/2, height/2))
      .force("collision", d3.forceCollide().radius(function(d){ return d.r + 2; }));

    var node = svg.selectAll("g").data(nodes).enter().append("g")
        .attr("transform", function(d){ return "translate(" + d.x + "," + d.y + ")"; });

    node.append("circle")
        .attr("r", function(d){return d.r;})
        .attr("fill", function(d,i){return color(i);})
        .attr("stroke", "#fff")
        .attr("stroke-width", 2);

    node.append("text")
        .attr("text-anchor", "middle")
        .attr("dy", ".3em")
        .style("fill", "#fff")
        .style("font-size", function(d){ return Math.max(10, d.r/3) + "px"; })
        .text(function(d){ return d.text; });

    simulation.on("tick", function(){
      node.attr("transform", function(d){ return "translate(" + d.x + "," + d.y + ")"; });
    });
  });
})();
</script>
</body>
</html>
