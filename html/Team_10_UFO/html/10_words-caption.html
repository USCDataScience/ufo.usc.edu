<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Word Frequency in Image Captions</title>
    <style>
body {
  margin: 0;
  padding: 20px;
  background: #fff;
  font-family: sans-serif;
  text-align: center;
}
	  .tooltip{
  position: absolute;	
  text-align: center;	
  width: 13%;	
  height:10%;		
  padding: 2vw;	
  font: 1.2vw sans-serif;		
  border: 0px;					
  border-radius: 8px;
  color:black;
  box-shadow: -3px 3px 15px #888888;
  opacity:0;	
}
#svgContent {
  text-align: center;
  margin: 20px auto;
}
</style>
</head>
<body>
<script src="../../../js/d3.v3.min.js"></script>
    <div><p>We are trying to depict that more words <br>
    related to background and scenery appearing <br>
      than to UFOs in the image itself</p></div>
<div id = "svgContent"></div>
<script>
var data = [{"caption":"Sunset","frequency":28},
            {"caption":"Air","frequency":261},
            {"caption":"Light","frequency":441},
            {"caption":"Building","frequency":387},
            {"caption":"Kite","frequency":1047},
            {"caption":"Sky","frequency":2349},          
			{"caption":"Flying","frequency":2745},
            {"caption":"Mountains","frequency":49},
            {"caption":"Trees","frequency":71}];

var width = 400;
var height = 400;
var radius = Math.min(width, height) / 2;

var color = d3.scale.category10();

var arc = d3.svg.arc()
    .outerRadius(radius - 10)
    .innerRadius(radius / 2);  // donut

var svg = d3.select("#svgContent").append("svg")
    .attr("width", width)
    .attr("height", height)
  .append("g")
    .attr("transform", "translate(" + width / 2 + "," + height / 2 + ")");

var div = d3.select("body").append("div")
    .attr("class", "tooltip");

var pie = d3.layout.pie()
    .sort(null)
    .value(function(d) { return d.frequency; });

var g = svg.selectAll(".arc")
    .data(pie(data))
  .enter().append("g")
    .attr("class", "arc")
    .on("mouseover", function(d) {
      div.html("Words in Captions: " + d.data.caption + "<br/>Frequency: " + d.data.frequency)
        .style("left", (d3.event.pageX + 10) + "px")
        .style("top", (d3.event.pageY - 10) + "px")
        .style("opacity", 1)
        .style("display", "block");
    })
    .on("mouseout", function() {
      div.style("opacity", 0).style("display", "none");
    });

g.append("path")
    .attr("d", arc)
    .style("fill", function(d) { return color(d.data.caption); });

g.append("text")
    .attr("transform", function(d) { return "translate(" + arc.centroid(d) + ")"; })
    .attr("dy", ".35em")
    .style("text-anchor", "middle")
    .text(function(d) { return d.data.caption; });
</script>
</body>
</html>
