<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="content-type" content="text/html; charset=utf-8" />
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <title>Top Shapes Donut (static demo)</title>
    <script src="https://d3js.org/d3.v3.min.js"></script>
    <style>
        body { font: 14px sans-serif; }
        .arc path { stroke: #fff; stroke-width: 3px; }
        .legend text { font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="display-4 text-center">Donut Chart</h1>
        <p class="lead text-center">Top 5 shapes reported in UFO sightings (static demo data)</p>
        <div id="donut-chart"></div>
        <p class="text-muted text-center"><small>Data synthesized/borrowed from shape counts in the corpus (e.g. similar to other teams' sighting data). Original relied on live Elasticsearch aggregation.</small></p>
    </div>

    <script>
        // Static top 5 shapes data (doc counts from shape reports in the UFO corpus; borrowed/adapted from team data files like ufo-shape-count)
        var shapes = [
            { key: "light", doc_count: 9065 },
            { key: "triangle", doc_count: 4593 },
            { key: "circle", doc_count: 3690 },
            { key: "disk", doc_count: 3353 },
            { key: "unknown", doc_count: 3333 }
        ];

        var width = 800,
            height = 500,
            radius = Math.min(width, height) / 2,
            labelr = radius - 50;

        var color = ['#ff7f0e', '#d62728', '#2ca02c', '#1f77b4', '#663300'];

        var arc = d3.svg.arc()
            .outerRadius(radius - 60)
            .innerRadius(120);

        var pie = d3.layout.pie()
            .sort(null)
            .value(function (d) { return d.doc_count; });

        var svg = d3.select("#donut-chart").append("svg")
            .attr("width", width)
            .attr("height", height)
            .append("g")
            .attr("transform", "translate(" + width / 2 + "," + height / 2 + ")");

        var g = svg.selectAll(".arc")
            .data(pie(shapes))
            .enter()
            .append("g")
            .attr("class", "arc");

        g.append("path")
            .attr("d", arc)
            .style("fill", function (d, i) { return color[i]; });

        g.append("text")
            .attr("transform", function (d) {
                var c = arc.centroid(d),
                    x = c[0],
                    y = c[1],
                    h = Math.sqrt(x * x + y * y);
                return "translate(" + (x / h * labelr) + ',' + (y / h * labelr) + ")";
            })
            .attr("dy", ".35em")
            .style("text-anchor", function (d) {
                return (d.endAngle + d.startAngle) / 2 > Math.PI ? "end" : "start";
            })
            .style("fill", "black")
            .text(function (d) { return d.data.key; });

        // simple legend
        var legend = svg.selectAll(".legend")
            .data(shapes)
            .enter()
            .append("g")
            .attr("class", "legend")
            .attr("transform", function (d, i) { return "translate(" + (radius + 20) + "," + (i * 20 - 50) + ")"; });

        legend.append("rect")
            .attr("width", 18)
            .attr("height", 18)
            .style("fill", function (d, i) { return color[i]; });

        legend.append("text")
            .attr("x", 24)
            .attr("y", 9)
            .attr("dy", ".35em")
            .text(function (d) { return d.key + " (" + d.doc_count + ")"; });
    </script>
</body>
</html>
